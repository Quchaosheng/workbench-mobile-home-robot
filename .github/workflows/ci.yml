name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Installed from the committed hash-checked lock, not the pyproject ranges.
      # pip cannot hash an editable local project, so the project itself is a
      # separate --no-deps step. See docs/security/reproducible-python-lock.md.
      - run: python -m pip install --require-hashes -r docker/requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/scripts/lock_python_dependencies.py verify
      - run: make lint
      - run: make test
      - run: make contract
      - run: make scenario-check
      - run: make scenario-conformance
      - run: make readiness-report-check
      - run: make phase-gates-check
      - run: make run-identity-check
      - run: make run-provenance-check
      - name: Assert skipped Gazebo execution is not a pass
        run: |
          mkdir -p runs
          set +e
          python tests/regression/run_frozen_scenarios.py \
            --version ci \
            --runner gazebo \
            --output-dir runs/ci-frozen > runs/ci-frozen-summary.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q "NOT_EXECUTED" runs/ci-frozen-summary.txt
          ! grep -q -E "placeholder|VTCR" runs/ci-frozen-summary.txt
      - run: make golden-check
      - run: make context-check
      - run: python tools/scripts/check_task_packet.py --all
      - if: github.event_name == 'pull_request'
        run: python tools/scripts/check_task_packet.py --all --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - run: make docs
      - run: make demo-scripted
      - run: make demo-offline

  bsp-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pyyaml pytest
      - name: Validate BSP manifests and readiness
        run: |
          python bsp/validation/validate_manifests.py
          python bsp/validation/check_readiness.py
      - name: Run BSP manifest tests
        run: python -m pytest tests/unit/test_bsp_manifests.py -q

  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: workbench-1:ci
          cache-from: type=gha,scope=ci-runtime
          cache-to: type=gha,mode=max,scope=ci-runtime
      - run: docker run --rm --workdir /opt/workbench_source workbench-1:ci python tools/scripts/local_runner.py --goal "Place the red block in the tray"

  kernel-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install kernel headers and can-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "linux-headers-$(uname -r)" \
            linux-headers-generic \
            "linux-modules-extra-$(uname -r)" \
            can-utils ethtool build-essential
      - name: Build and check wbcan.ko
        run: |
          for headers in /usr/src/linux-headers-*-generic; do
            make -C kernel/wbcan clean KDIR="$headers"
            make -C kernel/wbcan KDIR="$headers"
          done
          make -C kernel/wbcan clean
          make -C kernel/wbcan
          make -C kernel/wbcan checkpatch
      - name: Load the module and bring the interface up
        id: module_load
        run: |
          sudo modprobe can
          sudo modprobe can_raw
          modinfo can-dev
          sudo modprobe can-dev
          sudo modprobe vcan
          sudo ip link add wbcan0 type vcan
          if sudo insmod kernel/wbcan/wbcan.ko; then
            echo "wbcan unexpectedly loaded across a name collision"
            exit 1
          fi
          test ! -e /sys/kernel/debug/wbcan
          sudo ip link del wbcan0
          if sudo insmod kernel/wbcan/wbcan.ko fail_debugfs=1; then
            echo "wbcan unexpectedly loaded with injected debugfs failure"
            exit 1
          fi
          test ! -e /sys/class/net/wbcan0
          test ! -e /sys/kernel/debug/wbcan
          sudo insmod kernel/wbcan/wbcan.ko
          if sudo insmod kernel/wbcan/wbcan.ko; then
            echo "wbcan unexpectedly allowed duplicate module insertion"
            exit 1
          fi
          sudo ip link set wbcan0 type can restart-ms 100
          sudo ip link set wbcan0 up
          ip -details link show wbcan0

      - name: Run SocketCAN ingress boundary probe
        id: socketcan_ingress
        if: steps.module_load.outcome == 'success'
        env:
          SOCKETCAN_INGRESS_REPORT: ${{ runner.temp }}/wbcan-socketcan-ingress-report.json
        run: |
          set +e
          sudo python3 kernel/wbcan/test_socketcan_ingress.py wbcan0 \
            --source virtual-wbcan \
            --report "$SOCKETCAN_INGRESS_REPORT" \
            --require-pass
          status=$?
          set -e
          if [ ! -s "$SOCKETCAN_INGRESS_REPORT" ]; then
            python3 kernel/wbcan/test_socketcan_ingress.py wbcan0 \
              --source virtual-wbcan \
              --write-not-executed-report "$SOCKETCAN_INGRESS_REPORT" \
              --not-executed-reason "the SocketCAN ingress probe did not produce a report (exit $status)"
          fi
          exit "$status"

      - name: Validate SocketCAN ingress evidence
        id: socketcan_ingress_report
        if: always()
        env:
          SOCKETCAN_INGRESS_REPORT: ${{ runner.temp }}/wbcan-socketcan-ingress-report.json
        run: |
          if [ ! -s "$SOCKETCAN_INGRESS_REPORT" ]; then
            python3 kernel/wbcan/test_socketcan_ingress.py wbcan0 \
              --source virtual-wbcan \
              --write-not-executed-report "$SOCKETCAN_INGRESS_REPORT" \
              --not-executed-reason "the module bring-up did not complete before the SocketCAN ingress probe"
          fi
          python3 kernel/wbcan/test_socketcan_ingress.py \
            --validate-report "$SOCKETCAN_INGRESS_REPORT" \
            --require-pass

      - name: Upload SocketCAN ingress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wbcan-socketcan-ingress-report
          path: ${{ runner.temp }}/wbcan-socketcan-ingress-report.json
          if-no-files-found: error

      - name: Mark kernel diagnostic scope
        run: |
          marker="wbcan-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "WBCAN_DIAGNOSTIC_MARKER=$marker" >> "$GITHUB_ENV"
          printf '<6>%s\n' "$marker" | sudo tee /dev/kmsg >/dev/null

      - name: Capture pre-fault-suite resource snapshot
        if: always()
        run: |
          sudo cat /proc/slabinfo > "$RUNNER_TEMP/wbcan-slabinfo-before.txt"
          cat /proc/meminfo > "$RUNNER_TEMP/wbcan-meminfo-before.txt"

      - name: Run the fault suite
        id: fault_suite
        env:
          WBCAN_TEST_REPORT: ${{ runner.temp }}/wbcan-test-report.tsv
          WBCAN_STRESS_REPORT: ${{ runner.temp }}/wbcan-stress-report.json
          WBCAN_STRESS_PROFILE: release
        run: |
          sudo env WBCAN_TEST_REPORT="$WBCAN_TEST_REPORT" WBCAN_STRESS_REPORT="$WBCAN_STRESS_REPORT" \
            WBCAN_STRESS_PROFILE="$WBCAN_STRESS_PROFILE" \
            ./kernel/wbcan/test_wbcan.sh wbcan0

      - name: Preserve a truthful stress result when execution was skipped
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/wbcan-stress-report.json" ]; then
            python3 kernel/wbcan/test_state_concurrency.py \
              --write-not-executed-report "$RUNNER_TEMP/wbcan-stress-report.json" \
              --profile release \
              --not-executed-reason "the privileged fault/stress step did not execute"
          fi

      - name: Validate stress evidence
        if: always()
        run: python3 kernel/wbcan/test_state_concurrency.py --validate-report "$RUNNER_TEMP/wbcan-stress-report.json" --require-pass

      - name: Capture and validate kernel diagnostics
        if: always()
        env:
          DMESG_LOG: ${{ runner.temp }}/wbcan-dmesg.log
          BEFORE_SLABINFO_LOG: ${{ runner.temp }}/wbcan-slabinfo-before.txt
          BEFORE_MEMINFO_LOG: ${{ runner.temp }}/wbcan-meminfo-before.txt
          SLABINFO_LOG: ${{ runner.temp }}/wbcan-slabinfo.txt
          MEMINFO_LOG: ${{ runner.temp }}/wbcan-meminfo.txt
          DIAGNOSTIC_REPORT: ${{ runner.temp }}/wbcan-kernel-diagnostics.json
        run: |
          sudo dmesg > "$DMESG_LOG"
          sudo cat /proc/slabinfo > "$SLABINFO_LOG"
          cat /proc/meminfo > "$MEMINFO_LOG"
          python3 kernel/wbcan/validate_kernel_diagnostics.py \
            --dmesg "$DMESG_LOG" --slabinfo "$SLABINFO_LOG" --meminfo "$MEMINFO_LOG" \
            --before-slabinfo "$BEFORE_SLABINFO_LOG" --before-meminfo "$BEFORE_MEMINFO_LOG" \
            --kernel "$(uname -r)" --marker "$WBCAN_DIAGNOSTIC_MARKER" --report "$DIAGNOSTIC_REPORT"
          python3 kernel/wbcan/validate_kernel_diagnostics.py --validate-report "$DIAGNOSTIC_REPORT"

      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wbcan-kernel-diagnostics
          path: |
            ${{ runner.temp }}/wbcan-dmesg.log
            ${{ runner.temp }}/wbcan-slabinfo-before.txt
            ${{ runner.temp }}/wbcan-meminfo-before.txt
            ${{ runner.temp }}/wbcan-slabinfo.txt
            ${{ runner.temp }}/wbcan-meminfo.txt
            ${{ runner.temp }}/wbcan-kernel-diagnostics.json
          if-no-files-found: error

      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wbcan-stress-report
          path: ${{ runner.temp }}/wbcan-stress-report.json
          if-no-files-found: error

      - name: Run and validate latency campaign
        id: latency_probe
        env:
          IDLE_REPORT: ${{ runner.temp }}/wbcan-latency-idle.json
          CONTROLLED_REPORT: ${{ runner.temp }}/wbcan-latency-controlled-load.json
          STATUS_REPORT: ${{ runner.temp }}/wbcan-latency-status-readers.json
          CAMPAIGN_REPORT: ${{ runner.temp }}/wbcan-latency-campaign.json
        run: |
          sudo python3 kernel/wbcan/test_latency.py wbcan0 --warmup 50 --samples 1000 \
            --repetitions 3 --report "$IDLE_REPORT" --commit "$GITHUB_SHA" --load-profile idle
          sudo python3 kernel/wbcan/test_latency.py wbcan0 --warmup 50 --samples 1000 \
            --repetitions 3 --report "$CONTROLLED_REPORT" --commit "$GITHUB_SHA" \
            --load-profile controlled-load --cpu-load-workers 2 --io-load-workers 1 \
            --load-directory "$RUNNER_TEMP"
          sudo python3 kernel/wbcan/test_latency.py wbcan0 --warmup 50 --samples 1000 \
            --report "$STATUS_REPORT" --commit "$GITHUB_SHA" --load-profile status-readers \
            --status-path /sys/kernel/debug/wbcan/wbcan0/status
          python3 kernel/wbcan/test_latency.py --validate-report "$IDLE_REPORT"
          python3 kernel/wbcan/test_latency.py --validate-report "$CONTROLLED_REPORT"
          python3 kernel/wbcan/test_latency.py --validate-report "$STATUS_REPORT"
          python3 kernel/wbcan/validate_latency_campaign.py "$IDLE_REPORT" "$CONTROLLED_REPORT" \
            --report "$CAMPAIGN_REPORT"
          python3 kernel/wbcan/validate_latency_campaign.py --validate-report "$CAMPAIGN_REPORT"

      - name: Upload latency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wbcan-latency-report
          path: ${{ runner.temp }}/wbcan-latency-*.json
          if-no-files-found: error

      - name: Report latency evidence result
        if: always()
        env:
          MODULE_LOAD_OUTCOME: ${{ steps.module_load.outcome }}
          LATENCY_PROBE_OUTCOME: ${{ steps.latency_probe.outcome }}
        run: |
          if [ "$LATENCY_PROBE_OUTCOME" = success ]; then
            status=PASS
          elif [ "$MODULE_LOAD_OUTCOME" = success ] && [ "$LATENCY_PROBE_OUTCOME" = failure ]; then
            status=FAIL
          else
            status=NOT_EXECUTED
          fi
          {
            echo "### wbcan virtual latency campaign"
            echo
            echo "Status: **$status**"
            echo
            echo "Three idle and controlled-load repetitions are observational evidence, not an SLA."
            echo "Physical CAN, MCU, actuator, PREEMPT_RT and hard-real-time claims remain NOT_EXECUTED."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" != FAIL

      - name: Validate structured driver test report
        id: fault_report
        if: always()
        run: python3 kernel/wbcan/validate_test_report.py "$RUNNER_TEMP/wbcan-test-report.tsv"

      - name: Upload driver test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wbcan-driver-test-report
          path: ${{ runner.temp }}/wbcan-test-report.tsv
          if-no-files-found: error

      - name: Report runtime fault result
        if: always()
        env:
          MODULE_LOAD_OUTCOME: ${{ steps.module_load.outcome }}
          FAULT_SUITE_OUTCOME: ${{ steps.fault_suite.outcome }}
          REPORT_VALIDATION_OUTCOME: ${{ steps.fault_report.outcome }}
        run: |
          case "$FAULT_SUITE_OUTCOME:$REPORT_VALIDATION_OUTCOME" in
            success:success) status=PASS ;;
            *:failure|failure:*) status=FAIL ;;
            *) status=NOT_EXECUTED ;;
          esac
          {
            echo "### wbcan runtime fault suite"
            echo
            echo "Status: **$status**"
            echo
            echo "| Phase | Outcome |"
            echo "| --- | --- |"
            echo "| Module insertion | $MODULE_LOAD_OUTCOME |"
            echo "| Fault suite | $FAULT_SUITE_OUTCOME |"
            echo "| Structured report | $REPORT_VALIDATION_OUTCOME |"
            if [ "$MODULE_LOAD_OUTCOME" = success ] && [ "$FAULT_SUITE_OUTCOME" = success ]; then
              echo "| Fault-plane readiness | PASS |"
            elif [ "$MODULE_LOAD_OUTCOME" = skipped ] || [ "$FAULT_SUITE_OUTCOME" = skipped ]; then
              echo "| Fault-plane readiness | NOT_EXECUTED |"
            else
              echo "| Fault-plane readiness | FAIL |"
            fi
            if [ "$status" = PASS ]; then
              echo "| Fault-mode coverage | PASS (7/7 advertised modes) |"
            else
              echo "| Fault-mode coverage | $status |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = PASS

      - name: Dump kernel log on failure
        if: failure()
        run: sudo dmesg | tail -50
      - name: Unload
        if: always()
        run: |
          sudo ip link set wbcan0 down 2>/dev/null || true
          sudo rmmod wbcan 2>/dev/null || true
          test ! -e /sys/class/net/wbcan0
          test ! -e /sys/kernel/debug/wbcan

  mcu-qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf qemu-system-misc
      - name: Build and run MCU checks
        run: |
          make -C firmware/mcu host
          make -C firmware/mcu test-host
          make -C firmware/mcu qemu
          make -C firmware/mcu verify-no-fp
          make -C firmware/mcu size-check
          make -C firmware/mcu test-qemu
