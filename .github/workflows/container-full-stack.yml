name: container-full-stack

# Issue #432: `static-and-cpu-image` is one of the required checks declared in
# .github/rulesets/main-protection.json, so the workflow that produces it has to
# be created for every pull request that targets `main`. A trigger `paths:`
# filter does the opposite: GitHub creates no run at all when the filter does not
# match, so a documentation-only, tools-only, dashboard-only or ruleset-only pull
# request never reported the required context. It was not a skipped job; the run
# did not exist.
#
# The fifteen filters now live inside the workflow as the `IMAGE_PATH_PATTERNS`
# data of the always-running `static-image-applicability` job, which records an
# explicit applicable/not-applicable result and the reason for it. Do not put a
# `paths:` or `paths-ignore:` filter back here: it needs owner review and a Task
# Packet, because it silently removes a required check from release evidence.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Issue #432: the always-running decision job. It answers "does the full-stack
  # image policy select any path this change touched?" and records the answer.
  # It is deliberately not path-filtered: it must run on every pull request so
  # the required context below can always report a result.
  static-image-applicability:
    runs-on: ubuntu-24.04
    outputs:
      applicable: ${{ steps.decide.outputs.applicable }}
      reason: ${{ steps.decide.outputs.reason }}
    env:
      # The fifteen trigger filters from before Issue #432, verbatim, as data.
      # `**` crosses directories and `*` does not, matching GitHub's `paths:`.
      IMAGE_PATH_PATTERNS: |
        Dockerfile
        compose.yaml
        requirements-mujoco.txt
        requirements*.txt
        pyproject.toml
        Makefile
        .dockerignore
        libs/**
        services/**
        firmware/**
        robot/**
        docker/**
        .devcontainer/**
        tests/unit/test_container_*.py
        .github/workflows/container-full-stack.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether the full-stack image applies to this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          ZERO = "0" * 40


          def revisions():
              """Return (base, head) for this run, or None when there is no comparison."""
              event = os.environ.get("EVENT_NAME", "")
              if event == "pull_request":
                  base = os.environ.get("PULL_REQUEST_BASE", "")
                  head = os.environ.get("PULL_REQUEST_HEAD", "")
              elif event == "push":
                  base = os.environ.get("PUSH_BEFORE", "")
                  head = os.environ.get("PUSH_AFTER", "")
              else:
                  return None
              if not re.fullmatch(r"[0-9a-f]{40}", base or "") or not re.fullmatch(r"[0-9a-f]{40}", head or ""):
                  return None
              # A brand-new branch has no predecessor; there is nothing to compare.
              if base == ZERO:
                  return None
              return base, head


          def changed_paths(base, head):
              """Paths the pull request or push introduces, relative to the merge base."""
              diff = subprocess.run(
                  ["git", "diff", "--name-only", f"{base}...{head}"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if diff.returncode != 0:
                  raise SystemExit("cannot list the changed paths: " + diff.stderr.strip())
              return [line for line in diff.stdout.splitlines() if line]


          def pattern_regex(pattern):
              """Translate one `paths:` pattern the way GitHub matches it."""
              out = []
              index = 0
              while index < len(pattern):
                  if pattern.startswith("**", index):
                      out.append(".*")
                      index += 2
                  elif pattern[index] == "*":
                      out.append("[^/]*")
                      index += 1
                  elif pattern[index] == "?":
                      out.append("[^/]")
                      index += 1
                  else:
                      out.append(re.escape(pattern[index]))
                      index += 1
              return "^" + "".join(out) + "$"


          def emit(applicable, reason):
              summary = "applicable=" + ("true" if applicable else "false")
              output = os.environ.get("GITHUB_OUTPUT")
              if not output:
                  raise SystemExit("GITHUB_OUTPUT is not set; the decision cannot be recorded, so it is not a pass")
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write(summary + "\n")
                  handle.write("reason=" + " ".join(reason.split())[:900] + "\n")
              print(summary + " reason=" + reason)
              sys.exit(0)


          patterns = [line.strip() for line in os.environ.get("IMAGE_PATH_PATTERNS", "").splitlines() if line.strip()]
          # An empty policy would classify every change as irrelevant. Treat the
          # missing policy as a failure rather than as a not-applicable result.
          if not patterns:
              raise SystemExit("IMAGE_PATH_PATTERNS is empty; a missing policy is a failure, not a not-applicable")

          revisions_to_compare = revisions()
          if revisions_to_compare is None:
              emit(True, "no comparable base revision (manual run or new branch), so the image is built")
          base, head = revisions_to_compare
          paths = changed_paths(base, head)
          matched = sorted({path for path in paths for pattern in patterns if re.match(pattern_regex(pattern), path)})
          if matched:
              emit(
                  True,
                  str(len(matched))
                  + " changed path(s) selected by the image path policy: "
                  + ", ".join(matched[:10]),
              )
          emit(
              False,
              "none of the "
              + str(len(patterns))
              + " image path patterns match the "
              + str(len(paths))
              + " changed path(s) of "
              + head[:12],
          )
          PY

  # The expensive job. It keeps the whole build, CPU smoke, SBOM and scan on
  # image-relevant changes only; it no longer owns the required check name,
  # because a job that is skipped never reports a usable result.
  static-image-build:
    needs: static-image-applicability
    if: needs.static-image-applicability.outputs.applicable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r docker/requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/unit/test_container_baseline.py tests/unit/test_container_profiles.py -v
      - run: python -m ruff check tests/unit/test_container_baseline.py tests/unit/test_container_profiles.py docker/*.py
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          # The tag names the architecture. A bare `latest` pull on an arm64 robot
          # otherwise fetches this amd64 image and fails at run time with an
          # exec-format error, which reads as a broken robot rather than a wrong
          # image (issue #591).
          tags: workbench-1:container-ci-amd64
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container-full-stack
          cache-to: type=gha,mode=max,scope=container-full-stack
      - name: CPU application smoke (no GPU request)
        run: docker run --rm --read-only --tmpfs /tmp:size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --workdir /opt/workbench_source workbench-1:container-ci-amd64 python tools/scripts/local_runner.py --goal "Place the red block in the tray"
      - name: CPU dashboard health
        run: |
          docker tag workbench-1:container-ci-amd64 workbench-1:local
          docker compose up -d --no-build dashboard
          trap 'docker compose down' EXIT
          for attempt in $(seq 1 30); do
            if docker compose exec -T dashboard curl --fail --silent http://127.0.0.1:8080/healthz \
              && docker compose exec -T dashboard curl --fail --silent http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs dashboard
          exit 1
      - name: Container contract and deterministic checks
        run: make container-project-check
      # Issue #579: the Revision D description and its frames artifact are checked
      # here rather than in foundation-checks, because expanding the model needs
      # `xacro` and only this image carries ros-jazzy-xacro. In a Python-only job
      # the same target reports INCOMPLETE and skips; here it is a hard check.
      - name: Validate the Revision D description and its frames artifact
        run: make container-description-check
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: workbench-1:container-ci-amd64
          format: spdx-json
          output-file: workbench-1-full-stack.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: workbench-1:container-ci-amd64
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: workbench-1-grype.json
          vex: docker/vex.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: workbench-full-stack-supply-chain
          path: |
            workbench-1-full-stack.spdx.json
            workbench-1-grype.json
          if-no-files-found: warn

  # Issue #591: the product compute is a Jetson Orin Nano Super, which is arm64.
  # The shipped image was built for linux/amd64 only, so `deploy/multi-host/`
  # pulled `${WORKBENCH_IMAGE}` and found no image for the robot's architecture.
  #
  # The build runs on a **native arm64 runner** rather than a qemu cross-build.
  # That is the honest default and the cheaper one in wall-clock terms: the base is
  # a CUDA runtime image, and `buildx` with qemu must emulate every apt and pip
  # step, which turns a minutes-long build into an hour-long one and times out on
  # large layers. `ubuntu-24.04-arm` is a free public runner, so the choice costs
  # nothing.
  #
  # The tag names the architecture, so a `latest` pull on the robot cannot silently
  # fetch an amd64 image and fail with an exec-format error.
  # The product compute is a Jetson Orin Nano Super, which is arm64, and no arm64
  # image is published. That is a real gap, recorded here rather than papered over.
  #
  # `Dockerfile:16` refuses any `TARGETARCH` other than `amd64`, and
  # `Dockerfile:69` pins the ROS 2 apt source to `[arch=amd64]`. Both are deliberate:
  # the CUDA base is pinned by digest to its amd64 manifest, and an arm64 build would
  # need an arm64 base digest, an `arch=arm64` ROS source, and re-verification of
  # every apt package. A job that "built arm64" by removing those two guards would
  # produce an image nobody validated -- which is worse than no image, because it
  # would look like one.
  #
  # So this job does not build. It reports the gap as an explicit, successful,
  # documented `not_published` conclusion. A red check nobody can fix is a check that
  # gets bypassed (#539); a green check that claims an image exists would be a lie.
  # The job becomes a real build when the Dockerfile grows an arm64 path.
  arm64-image-not-published:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Record that no arm64 image is published, and why
        run: |
          # The two guards that make an arm64 build a Dockerfile change rather than a
          # workflow change. Asserting them here means this job starts failing the
          # moment somebody adds an arm64 path, which is when it should be replaced
          # by a real build.
          grep -q 'test "${TARGETARCH}" = "amd64"' Dockerfile \
            || { echo "::error title=arm64::Dockerfile no longer pins amd64; replace this job with a real arm64 build"; exit 1; }
          grep -q 'arch=amd64' Dockerfile \
            || { echo "::error title=arm64::the ROS apt source is no longer amd64-pinned; replace this job with a real arm64 build"; exit 1; }

          {
            echo "### arm64 image: not published"
            echo ""
            echo "- conclusion: \`not_published\`"
            echo "- the base is pinned to the amd64 CUDA manifest by digest (Dockerfile:5)"
            echo "- the ROS 2 apt source is \`[arch=amd64]\` (Dockerfile:69)"
            echo "- publishing arm64 needs an arm64 base digest, an arm64 ROS source and"
            echo "  re-verification of every apt package; that is a recorded gap, not a build"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "arm64: not_published (documented gap; Dockerfile has no arm64 path)"

  # Issue #432: `static-and-cpu-image` is the name declared as a required check
  # in .github/rulesets/main-protection.json, so this job must always run and
  # always report. It reports one of three documented outcomes:
  #
  #   * success         -- the build job ran and every expensive step passed;
  #   * failure         -- the build job ran and a step failed, or the
  #                        applicability decision did not run at all;
  #   * not-applicable  -- the decision ran and selected no changed path.
  #
  # "Skipped" is never passed through: `if: always()` makes this job run even
  # when the build is skipped, which is exactly the case the old trigger path
  # filter hid by never creating the workflow at all. "not-applicable" is a
  # truthful gate result, not a passing image check: the release checker still
  # refuses anything other than `success` on a tagged commit, so a release that
  # touches the image must carry a real build. It also exits 0 so the required
  # check turns green for an irrelevant change instead of blocking the merge.
  static-and-cpu-image:
    needs:
      - static-image-applicability
      - static-image-build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report the required check conclusion
        env:
          BUILD_RESULT: ${{ needs.static-image-build.result }}
          APPLY_RESULT: ${{ needs.static-image-applicability.result }}
          APPLY_REASON: ${{ needs.static-image-applicability.outputs.reason }}
        run: |
          case "$BUILD_RESULT" in
            success)
              conclusion="success"
              detail="the full-stack image was built and the CPU smoke, SBOM and vulnerability scan passed"
              ;;
            failure)
              conclusion="failure"
              detail="the full-stack image job ran and reported a failing step"
              ;;
            skipped)
              if [ "$APPLY_RESULT" = "success" ]; then
                conclusion="not-applicable"
                detail="${APPLY_REASON:-no changed path is selected by the image path policy}"
              else
                conclusion="failure"
                detail="the applicability decision did not run ($APPLY_RESULT), so the image cannot be shown to be irrelevant"
              fi
              ;;
            cancelled)
              conclusion="cancelled"
              detail="the full-stack image job was cancelled, which proves nothing"
              ;;
            *)
              conclusion="failure"
              detail="the full-stack image job reported no usable result ($BUILD_RESULT)"
              ;;
          esac
          {
            echo "### static-and-cpu-image"
            echo ""
            echo "- conclusion: \`$conclusion\`"
            echo "- build job result: \`$BUILD_RESULT\`"
            echo "- $detail"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "static-and-cpu-image: $conclusion ($detail)"
          if [ "$conclusion" != "success" ] && [ "$conclusion" != "not-applicable" ]; then
            exit 1
          fi
