name: container-full-stack

on:
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - requirements-mujoco.txt
      - requirements*.txt
      - pyproject.toml
      - Makefile
      - .dockerignore
      - libs/**
      - services/**
      - firmware/**
      - robot/**
      - docker/**
      - .devcontainer/**
      - tests/unit/test_container_*.py
      - .github/workflows/container-full-stack.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - requirements-mujoco.txt
      - requirements*.txt
      - pyproject.toml
      - Makefile
      - .dockerignore
      - libs/**
      - services/**
      - firmware/**
      - robot/**
      - docker/**
      - .devcontainer/**
      - tests/unit/test_container_*.py
      - .github/workflows/container-full-stack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-cpu-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit/test_container_baseline.py tests/unit/test_container_profiles.py -v
      - run: python -m ruff check tests/unit/test_container_baseline.py tests/unit/test_container_profiles.py docker/*.py
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: workbench-1:container-ci
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container-full-stack
          cache-to: type=gha,mode=max,scope=container-full-stack
      - name: CPU application smoke (no GPU request)
        run: docker run --rm --read-only --tmpfs /tmp:size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --workdir /opt/workbench_source workbench-1:container-ci python tools/scripts/local_runner.py --goal "Place the red block in the tray"
      - name: CPU dashboard health
        run: |
          docker tag workbench-1:container-ci workbench-1:local
          docker compose up -d --no-build dashboard
          trap 'docker compose down' EXIT
          for attempt in $(seq 1 30); do
            if docker compose exec -T dashboard curl --fail --silent http://127.0.0.1:8080/healthz \
              && docker compose exec -T dashboard curl --fail --silent http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs dashboard
          exit 1
      - name: Container contract and deterministic checks
        run: make container-project-check
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: workbench-1:container-ci
          format: spdx-json
          output-file: workbench-1-full-stack.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/scan-action@8964e60c6fabdb85fdbbbfd9834d8f19c97a3086  # v7.4.1
        with:
          image: workbench-1:container-ci
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: workbench-1-grype.json
          vex: docker/vex.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: workbench-full-stack-supply-chain
          path: |
            workbench-1-full-stack.spdx.json
            workbench-1-grype.json
          if-no-files-found: warn
