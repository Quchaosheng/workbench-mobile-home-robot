name: release-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Reading the required check runs for the tagged commit is what proves the
  # safety matrix ran on this exact commit before an image may be built.
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-build-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          make check

      # A tag can be pushed onto any commit, including one that never saw a pull
      # request. Refuse the release unless the tagged commit is reachable from
      # protected main and every required check succeeded on it. Exit 2 is a
      # failure here: an unobservable matrix must not publish an image.
      - name: Verify the tagged commit passed the required safety matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/scripts/check_release_commit.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --protected-branch main

      - name: Verify the full Task Packet and contract gate
        run: |
          python tools/scripts/check_task_packet.py --all
          make contract
          make scenario-check
          make context-check

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          load: true
          tags: workbench-1:release-candidate
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime

      - name: Smoke-test image
        run: docker run --rm --workdir /opt/workbench_source workbench-1:release-candidate python tools/scripts/local_runner.py --goal "Place the red block in the tray"

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: workbench-1:release-candidate
          format: spdx-json
          output-file: workbench-1.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: workbench-1:release-candidate
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: workbench-1-grype.json
          vex: docker/vex.json

      - name: Publish tested image
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag workbench-1:release-candidate "$tag"
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
          first_tag="$(printf '%s\n' "$IMAGE_TAGS" | sed -n '/./{p;q;}')"
          digest="$(docker image inspect "$first_tag" --format '{{index .RepoDigests 0}}' | awk -F@ '{print $2}')"
          if [ -z "$digest" ]; then
            echo "Published image has no registry digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: workbench-1-sbom
          path: |
            workbench-1.spdx.json
            workbench-1-grype.json

      - name: Write release provenance manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          python tools/scripts/release_manifest.py \
            --image workbench-1:release-candidate \
            --sbom workbench-1.spdx.json \
            --version "$RELEASE_VERSION" \
            --registry-image "$REGISTRY_IMAGE" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --output release-manifest.json

      # Provenance is checked before the image is attested or the manifest is
      # published as an artifact. A manifest missing a digest-pinned base image,
      # a committed lock revision or a registry image digest stops here rather
      # than becoming release evidence.
      - name: Verify release provenance
        run: |
          python tools/scripts/release_manifest.py \
            --verify release-manifest.json

      - name: Attest published image
        if: steps.publish.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # Record the attestation outcome and refuse promotion unless the manifest
      # is complete *and* the published image carries a signed attestation.
      - name: Verify promotion readiness
        if: steps.publish.outputs.digest != ''
        run: |
          python tools/scripts/release_manifest.py \
            --mark-attestation signed \
            --output release-manifest.json \
            --require-promotion

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: workbench-1-release-provenance
          path: release-manifest.json
