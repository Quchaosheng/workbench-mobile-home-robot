<body><div id="scene"></div><div class="copy"><div class="eyebrow">VORA HOME ROBOT · REV D</div><h1>家里的小事，<br>我来搭把手。</h1><p>会移动、会取放，也会先确认再行动。<br>双臂协作取件、清洁与锅边备餐。</p><span class="warm-note"><i></i>懂分寸，也懂照顾</span></div><div class="scene-label"><b>CONCEPT · PHYSICAL VALIDATION REQUIRED</b><br>HOLONOMIC BIMANUAL MANIPULATION</div><div class="status-strip"><div class="status-item"><span class="dot"></span>双臂协作</div><div class="status-item peach"><span class="dot"></span>四轮灵活移动</div><div class="status-item ivory"><span class="dot"></span>先验证，再行动</div><div class="revision">REVISION D&nbsp; / &nbsp;CONCEPT</div></div>

const physical=(c,r=.4,m=0)=>new THREE.MeshPhysicalMaterial({color:c,roughness:r,metalness:m,clearcoat:.18,clearcoatRoughness:.3});const shell=physical(0xfaf6ee,.28,.03),armShell=physical(0x425950,.36,.18),metal=physical(0x6f8179,.34,.48),armTrim=physical(0x2e3d38,.42,.42),graphite=physical(0x3b5148,.46,.25),elastomer=physical(0x2b3a35,.78,.05),jade=physical(0x75c9b4,.25,.12),peach=physical(0xf2a77f,.34,.08),glass=physical(0x101c1a,.12,.22);const textile=new THREE.MeshStandardMaterial({color:0x56625c,roughness:.98});
function add(g,mat,p,r=[0,0,0],scale=[1,1,1]){const raw=p?.isVector3?[p.x,p.y,p.z]:p;const q=(Array.isArray(raw)?raw:[0,0,0]).map(v=>Number.isFinite(v)?v:0);const o=new THREE.Mesh(g,mat);o.position.set(...q);o.rotation.set(...r);o.scale.set(...scale);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}function box(w,h,d,r,mat,p,rot=[0,0,0]){const rr=Math.max(.008,Math.min(r,w/2-.006,h/2-.006,d/2-.006));return add(new RoundedBoxGeometry(w,h,d,8,rr),mat,p,rot)}function cyl(rad,len,mat,p,rot=[0,0,0]){const R=Number.isFinite(rad)?Math.max(.01,rad):.1;const L=Number.isFinite(len)?Math.max(.02,len):.1;return add(new THREE.CylinderGeometry(R,R,L,48),mat,p,rot)}function wheel(rad,len,mat,p,steer=0){const axis=new THREE.Vector3(Math.cos(steer),0,Math.sin(steer));const o=add(new THREE.CylinderGeometry(rad,rad,len,56),mat,p);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),axis);return o}

for(const x of[-.98,2.28])for(const z of[-1.36,1.40]){const steer=(x<.65?-.22:.22)+(z<0?.08:-.08);cyl(.23,.26,metal,[x,.70,z],[0,0,0]);box(.48,.30,.46,.14,graphite,[x,.50,z]);wheel(.34,.34,elastomer,[x,.40,z],steer);wheel(.12,.38,metal,[x,.40,z],steer);cyl(.17,.05,jade,[x,.85,z],[0,0,0])}

function jointCartridge(p,r,rot=[Math.PI/2,0,0]){add(new THREE.SphereGeometry(r*.72,24,16),armShell,p);cyl(r*.55,.06,armTrim,p,rot);cyl(r*.18,.07,jade,p,rot)}function link(a,b,r,matl=metal){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),v=B.clone().sub(A),mid=A.clone().add(B).multiplyScalar(.5);const o=add(new THREE.CylinderGeometry(r*.86,r*1.08,v.length(),36),matl,mid);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());return o}function fairedLink(a,b,w,d,matl=shell,r=.18,gap=.16){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),axis=B.clone().sub(A),unit=axis.clone().normalize(),g=Math.min(gap,axis.length()*.22),S=A.clone().addScaledVector(unit,g),E=B.clone().addScaledVector(unit,-g),v=E.clone().sub(S),mid=S.clone().add(E).multiplyScalar(.5),rr=Math.min(r,w*.34,d*.34);const o=add(new RoundedBoxGeometry(w,v.length(),d,8,rr),matl,mid);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());return o}

buildArm(-1);buildArm(1);
// Both adaptive grippers contact the parcel sides in the shared bimanual volume.
const parcel=box(1.08,.76,.86,.16,physical(0xc9ad86,.7,.02),[.65,3.06,2.68]);box(.07,.78,.90,.02,physical(0x34423d,.62,.1),[.65,3.06,2.68],[0,0,0]);
// The head and torso meet through a narrow overlapping shell, with no visible neck break.
box(.86,1.06,.68,.32,shell,[.65,5.38,0]);box(2.82,1.38,1.08,.56,shell,[.65,6.50,0],[-.05,0,.015]);box(2.48,.92,.44,.24,glass,[.65,6.48,.34],[-.05,0,.015]);for(const x of[.29,1.01]){const eye=cyl(.085,.025,jade,[x,6.54,.575],[Math.PI/2,0,0]);eye.scale.set(1,.72,1)}for(const x of[.18,1.12])cyl(.085,.026,peach,[x,6.35,.576],[Math.PI/2,0,0]);box(.25,.035,.028,.018,jade,[.65,6.30,.58],[-.05,0,0]);box(.10,.035,.028,.018,jade,[.48,6.32,.58],[-.05,0,-.25]);box(.10,.035,.028,.018,jade,[.82,6.32,.58],[-.05,0,.25]);
