version: "0.1"
status: recommended_prototype_selection_pending_supplier_and_electrical_approval
quantity_decision:
  linux_boards_per_robot: 1
  controller_domains_per_robot: 6
  robot_owned_mcus_per_robot: 2
  arm_tool_module_controller_domains_per_robot: 4
  lift_mcu: false
  change_control: new_architecture_review_required
linux_board:
  role: high_level_compute_and_gateway
  model: NVIDIA_JETSON_ORIN_NANO_SUPER_DEVELOPER_KIT_8GB
  soc: NVIDIA_ORIN_NANO
  target_kernel: JETPACK_BSP_RELEASE_TO_BE_CONFIRMED
  selection_status: recommended_prototype_selection
  storage: NVME_512GB_MINIMUM
  cooling: ACTIVE_COOLER_REQUIRED
  interfaces:
    can: can0
    ethernet: eth0
    usb: usb0
    mcu_uart: ttyS-mcu
    debug_uart: ttyS-debug
    management_i2c: i2c-bmc
    expansion_spi: spi-exp
    watchdog: watchdog0
controller_domains:
  - id: MCU-BASE
    node_id: 0x10
    part: STM32G474RET6
    can_controller: FDCAN
    role: traction_and_lift
    reset_domain: base_motion
  - id: ARM-L-CTRL
    node_id: 0x11
    role: left_seven_axis_arm
    reset_domain: left_arm
  - id: ARM-R-CTRL
    node_id: 0x12
    role: right_seven_axis_arm
    reset_domain: right_arm
    implementation: vendor_or_module_controller
  - id: TOOL-L-CTRL
    node_id: 0x13
    role: left_end_effector
    reset_domain: left_tool
    implementation: vendor_or_module_controller
  - id: TOOL-R-CTRL
    node_id: 0x14
    role: right_end_effector
    reset_domain: right_tool
    implementation: vendor_or_module_controller
  - id: MCU-SAFETY
    node_id: 0x1F
    role: estop_watchdog_safe_enable_and_fault_latch
    reset_domain: independent_safety
can:
  logical_bus: can0
  transport: SocketCAN
  controller: ISOLATED_USB_CAN_FD_ADAPTER_PROTOTYPE
  bitrate: TBD_ELECTRICAL_SELECTION
  safety_node_priority: highest
  termination: TBD_ELECTRICAL_SELECTION
boundaries:
  linux_is_not_safety_authority: true
  wbcan_is_physical_evidence: false
  physical_bringup_complete: false
robot_owned_mcus:
  - id: MCU-BASE
    part: STM32G474RET6
    can_controller: FDCAN
    selection_status: recommended_prototype_selection
  - id: MCU-SAFETY
    part: STM32G0B1
    selection_status: recommended_prototype_selection
module_controller_selection:
  ARM-L-CTRL: vendor_arm_controller
  ARM-R-CTRL: vendor_arm_controller
  TOOL-L-CTRL: vendor_tool_controller_or_can_rs485_node
  TOOL-R-CTRL: vendor_tool_controller_or_can_rs485_node
