services:
  controller:
    image: ${WORKBENCH_IMAGE:-workbench-1:local}
    command:
      [
        "python",
        "-m",
        "workbench_backend.server",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--event-source-url",
        "${WORKBENCH_EVENT_SOURCE_URL:?Set WORKBENCH_EVENT_SOURCE_URL to the simulation host}",
        "--event-source-allowlist",
        "${WORKBENCH_EVENT_SOURCE_ALLOWLIST:?Set WORKBENCH_EVENT_SOURCE_ALLOWLIST to literal IP addresses or CIDR ranges}",
        "--published-host",
        "${CONTROLLER_BIND_ADDRESS-127.0.0.1}",
        "--trust-mode",
        "${WORKBENCH_CONTROLLER_TRUST_MODE-local}",
        "--trusted-proxy-allowlist",
        "${WORKBENCH_CONTROLLER_TRUSTED_PROXY_ALLOWLIST:-}",
      ]
    environment:
      WORKBENCH_OFFLINE: "1"
      WORKBENCH_EVENT_SOURCE_URL: ${WORKBENCH_EVENT_SOURCE_URL:?Set WORKBENCH_EVENT_SOURCE_URL to the simulation host}
      WORKBENCH_EVENT_SOURCE_ALLOWLIST: ${WORKBENCH_EVENT_SOURCE_ALLOWLIST:?Set WORKBENCH_EVENT_SOURCE_ALLOWLIST to literal IP addresses or CIDR ranges}
      CONTROLLER_BIND_ADDRESS: ${CONTROLLER_BIND_ADDRESS-127.0.0.1}
      WORKBENCH_CONTROLLER_TRUST_MODE: ${WORKBENCH_CONTROLLER_TRUST_MODE-local}
      WORKBENCH_CONTROLLER_TRUSTED_PROXY_ALLOWLIST: ${WORKBENCH_CONTROLLER_TRUSTED_PROXY_ALLOWLIST:-}
      # Alert debounce policy for this controller. Unset stays the documented
      # zero policy, which the API labels debounce_disabled. Set either window
      # (seconds, 0..3600) to enable debounce; a malformed value stops startup.
      WORKBENCH_ALERT_OPEN_AFTER_SECONDS: ${WORKBENCH_ALERT_OPEN_AFTER_SECONDS:-}
      WORKBENCH_ALERT_CLEAR_AFTER_SECONDS: ${WORKBENCH_ALERT_CLEAR_AFTER_SECONDS:-}
      WORKBENCH_ALERT_HISTORY_AGE_SECONDS: ${WORKBENCH_ALERT_HISTORY_AGE_SECONDS:-}
      WORKBENCH_ALERT_MAX_HISTORY: ${WORKBENCH_ALERT_MAX_HISTORY:-}
    ports:
      - target: 8080
        published: "${CONTROLLER_PORT:-8080}"
        host_ip: "${CONTROLLER_BIND_ADDRESS-127.0.0.1}"
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
