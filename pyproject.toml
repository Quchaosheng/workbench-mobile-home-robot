[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-1"
version = "0.2.0"
description = "Evidence-first embodied-agent simulator foundation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "jsonschema>=4,<5",
  "pytest-cov>=5,<8",
  "pytest-benchmark>=4,<6",
  "ruff==0.16.6",
  "pre-commit>=3,<5",
  "kiutils>=1.4,<2",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocstrings[python]>=0.27,<2",
]

[tool.setuptools]
packages = [
  "workbench.application",
  "workbench.hardware",
  "workbench.kernel",
  "workbench_task_utils",
  "workbench_agent_runtime",
  "workbench_backend",
  "workbench_contracts",
  "workbench_virtual_mcu",
  "workbench_world_model",
]

[tool.setuptools.package-dir]
"workbench.application" = "libs/application/workbench/application"
"workbench.hardware" = "libs/hardware/workbench/hardware"
"workbench.kernel" = "libs/kernel/workbench/kernel"
workbench_task_utils = "libs/task_utils/workbench_task_utils"
workbench_agent_runtime = "services/agent_runtime/workbench_agent_runtime"
workbench_backend = "services/backend/workbench_backend"
workbench_contracts = "libs/contracts/workbench_contracts"
workbench_virtual_mcu = "firmware/virtual_mcu/workbench_virtual_mcu"
workbench_world_model = "services/world_model/workbench_world_model"

[tool.setuptools.package-data]
workbench_backend = ["api-openapi-v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "libs/kernel/tests"]
python_files = ["test_*.py"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "integration: marks tests as integration tests (跨模块)",
  "regression: marks tests as regression tests (12 场景)",
  "benchmark: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["services", "libs", "firmware"]
omit = ["*/tests/*", "*/__pycache__/*", "*/build/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["build"]

# Rules are deliberately a small, high-signal set. The point is to catch real
# defects (undefined names, unused imports, mutable default arguments), not to
# enforce taste. Widen this only when the team agrees the added rule is worth the
# churn it causes.
[tool.ruff.lint]
select = [
  "F",    # pyflakes: undefined names, unused imports, f-string mistakes
  "E",    # pycodestyle errors
  "I",    # import ordering
  "B",    # bugbear: mutable defaults, shadowed loop vars, assert-false
  "BLE",  # broad exceptions must be deliberate
  "UP",   # pyupgrade: no 3.8 idioms in a 3.12 project
  "RUF",  # ruff's own correctness rules
]
ignore = [
  # These scripts must add the local package paths to sys.path before they can
  # import the packages under test, so the import cannot come first. The pattern
  # is intentional and is the documented way to run the tools without installing.
  "E402",
]

[tool.ruff.lint.per-file-ignores]
# Tests repeat setup deliberately and use literal fixtures.
"tests/**" = ["B011"]

# Format is checked in CI. Run `make fmt` to auto-fix locally.
[tool.ruff.format]
quote-style = "double"
