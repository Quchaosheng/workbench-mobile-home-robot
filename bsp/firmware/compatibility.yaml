version: "0.1"
status: compatibility_contract_only
linux_bundle:
  board: NVIDIA_JETSON_ORIN_NANO_SUPER_DEVELOPER_KIT_8GB
  image: TBD_BUILD_ARTIFACT
  compatibility_manifest: required
controllers:
  MCU-BASE:
    part: STM32G474RET6
    protocol: MCU_WIRE_V1
    can_controller: FDCAN
    minimum_firmware: TBD
    required_capabilities: [traction, encoders, lift, watchdog, can_fd]
  MCU-SAFETY:
    part: STM32G0B1
    protocol: MCU_WIRE_V1
    minimum_firmware: TBD
    required_capabilities: [estop, safe_enable, watchdog, fault_latch]
  ARM-L-CTRL:
    implementation: vendor_controller
    protocol: TBD_SUPPLIER_PROTOCOL
    minimum_firmware: TBD_SUPPLIER
  ARM-R-CTRL:
    implementation: vendor_controller
    protocol: TBD_SUPPLIER_PROTOCOL
    minimum_firmware: TBD_SUPPLIER
  TOOL-L-CTRL:
    implementation: vendor_controller
    protocol: TBD_SUPPLIER_PROTOCOL
    minimum_firmware: TBD_SUPPLIER
  TOOL-R-CTRL:
    implementation: vendor_controller
    protocol: TBD_SUPPLIER_PROTOCOL
    minimum_firmware: TBD_SUPPLIER
rules:
  incompatible_versions_inhibit_motion: true
  linux_restart_does_not_clear_safety_latch: true
  boot_id_change_invalidates_old_acknowledgements: true
