version: "0.1"
status: service_topology_only
default_motion_state: inhibited
services:
  robot-time-sync:
    after: [network-online.target]
    requires: [rtc_present_or_network_time_source]
    restart: on-failure
    restart_limit: bounded
    safety_authority: false
    # Every wall-stamped evidence record depends on this service. It is ordered
    # first so no writer can stamp a record before the clock is known, and the
    # gates below record why (issue #594).
    output: wall_clock_reference
  robot-can-gateway:
    after: [network.target]
    requires: [can0]
    restart: on-failure
    restart_limit: bounded
    safety_authority: false
  robot-safety-monitor:
    after: [robot-can-gateway]
    requires: [MCU-SAFETY]
    restart: on-failure
    restart_limit: bounded
    safety_authority: false
    mode: read_only_mirror
  robot-device-manager:
    after: [robot-can-gateway, robot-safety-monitor]
    requires: [firmware_compatibility_manifest]
    restart: on-failure
    restart_limit: bounded
    safety_authority: false
  robot-camera-head:
    after: [robot-device-manager]
    requires: [d435_serial_identity, vendor_udev_rules, camera_calibration]
    restart: on-failure
    restart_limit: bounded
    safety_authority: false
    output: validated_observation_input
  robot-evidence-logger:
    # A logger that starts before the clock stamps a wrong wall time on every
    # record it writes, and nothing downstream can tell afterwards.
    after: [local-fs.target, robot-time-sync]
    requires: [writable_bounded_log_store]
    restart: on-failure
    restart_limit: bounded
    safety_authority: false
  robot-update-agent:
    after: [network-online.target]
    requires: [signed_update_bundle, rollback_slot]
    restart: "no"
    safety_authority: false
gates:
  wall_clock_unverified_refuses_evidence: true
  incompatible_firmware_inhibits_motion: true
  missing_safety_monitor_inhibits_motion: true
  service_restart_never_clears_safety_latch: true
  actuator_enable_during_boot: false
